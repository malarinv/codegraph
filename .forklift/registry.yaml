    status: "active"

# Upstream owns release notes and version bumps; the fork always takes them.
divergences:
  - path: "package-lock.json"
    reason: >-
      Lockfile tracks upstream dependency resolution; our `yaml` dep entry and
      version strings live beside upstream's. Take upstream on dependency-only
      conflicts, keep our added package entries otherwise.
    resolution: "prefer_upstream"
  - path: "CHANGELOG.md"
    reason: "Upstream owns release notes."
    resolution: "prefer_upstream"
  - path: "package.json"
    reason: "Upstream owns the published version number; the fork must not drift it on sync."
    resolution: "prefer_upstream"
  - path: ".github/workflows/release.yml"
    reason: >-
      Fork publishes to the GitHub Packages npm registry under malarinv
      (GITHUB_TOKEN + packages: write, no OIDC, no npmmirror), while upstream
      uses OIDC trusted publishing on npmjs.com. On a sync, keep the fork's
      publish/verify/npmrc wiring but re-anchor it onto upstream's step
      changes: our part is the registry choice and auth, upstream's is
      everything else in the file.
    resolution: "prefer_fork"
  - path: "scripts/pack-npm.sh"
    reason: >-
      Scope and repository URL derive from GITHUB_REPOSITORY so a fork packs
      @malarinv/* for GitHub Packages instead of upstream's hardcoded
      @colbymchenry scope. Falls back to @colbymchenry when GITHUB_REPOSITORY
      is unset, so upstream's copy keeps working.
    resolution: "prefer_fork"
  - path: "scripts/extract-release-notes.mjs"
    reason: >-
      Supports an optional --max-chars flag that trims the release notes to a
      GitHub-API release-body limit (125,000 chars) at bullet granularity.
      Without the flag the output is byte-identical to upstream's, so the
      divergence only activates from the fork's release.yml.
    resolution: "prefer_fork"
  - path: "scripts/npm-shim.js"
    reason: >-
      Resolves the per-platform optionalDependency from the installed main
      package's own name (and its repository URL for the self-heal download),
      so a fork published under another owner's scope works. Upstream's
      @colbymchenry name remains the fallback when the scoped name is absent.
    resolution: "prefer_fork"
  - path: "scripts/npm-sdk.js"
    reason: >-
      Same own-scope derivation as npm-shim.js for the `require` entry: the
      library resolves from the main package's scope, not a hardcoded one.
    resolution: "prefer_fork"

