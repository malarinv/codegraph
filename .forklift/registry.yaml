features:
  - name: "rego-language-support"
    description: >-
      Indexes Open Policy Agent (OPA) policy modules — rule heads become
      function nodes, rule-to-rule calls become resolvable calls edges,
      data/input paths become references, and packages and imports become
      import nodes. Carries the vendored tree-sitter-rego wasm so the grammar
      ships with the package rather than resolving from tree-sitter-wasms.
    owned_paths:
      - "src/types.ts"
      - "src/extraction/grammars.ts"
      - "src/extraction/languages/index.ts"
      - "src/extraction/languages/rego.ts"
      - "src/extraction/wasm/tree-sitter-rego.wasm"
      - "src/resolution/name-matcher.ts"
      - "__tests__/rego-policy-calls.test.ts"
    protecting_tests:
      - "__tests__/rego-policy-calls.test.ts"
    status: "active"

  - name: "gitops-yaml-manifests"
    description: >-
     Indexes Kubernetes, Flux, Crossplane and Backstage catalog YAML manifests
     through a gitops framework resolver: one struct node per apiVersion+kind
     document, reference edges for pointer keys (sourceRef, dependsOn, path,
     resources), and constant nodes for flat data files whose basename reaches
     the shape Rego reads (data.<basename>). Detection is per-repo but
     classification is per-file; libbyell plain-word basenames emit nothing.
    owned_paths:
      - "__tests__/gitops-yaml.test.ts"
      - "src/extraction/extraction-version.ts"
      - "src/resolution/frameworks/gitops.ts"
      - "src/resolution/frameworks/index.ts"
    protecting_tests:
      - "__tests__/gitops-yaml.test.ts"
    status: "active"

  - name: "forklift-harness"
    description: >-
      The forklift bookkeeping itself: the registry, harness lock, generated
      skill/agent artifacts and stamped docs. No product behavior; the fork's
      memory for later rebases.
    owned_paths:
      - ".forklift/README.md"
      - ".forklift/SKILL.md"
      - ".forklift/harness.lock"
      - ".forklift/registry.yaml"
      - ".claude/skills/forklift-doctor/SKILL.md"
      - ".claude/skills/forklift-init/SKILL.md"
      - ".claude/skills/forklift-maintain/SKILL.md"
      - ".cursor/rules/forklift-doctor.md"
      - ".cursor/rules/forklift-init.md"
